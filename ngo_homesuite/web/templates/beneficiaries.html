{% extends "base.html" %}
{% extends "base.html" %}

{% block title %}Beneficiaries - NGO HomeSuite{% endblock %}

{% block content %}
<h1>Beneficiaries</h1>
<p class="text-muted">Track individuals served by your programs.</p>

<div class="mb-3 mt-2 actions-row">
    <a href="{{ url_for('main.beneficiary_new') }}" class="btn btn-primary">Add Beneficiary</a>
</div>

<form method="get" class="mb-3" style="display:grid; gap:0.75rem; grid-template-columns: 1fr 220px auto; align-items:end;"
      hx-get="{{ url_for('main.beneficiaries_list') }}"
      hx-trigger="input changed delay:400ms from:#q, change from:#status"
      hx-target="#beneficiaries-results"
      hx-include="this">
    <div class="form-group" style="margin:0;">
        <label for="q">Search</label>
        <input type="text" id="q" name="q" value="{{ filter_q }}" placeholder="Name, email, or program" />
    </div>
    <div class="form-group" style="margin:0;">
        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="" {{ 'selected' if not filter_status else '' }}>All</option>
            <option value="active" {{ 'selected' if filter_status == 'active' else '' }}>Active</option>
            <option value="inactive" {{ 'selected' if filter_status == 'inactive' else '' }}>Inactive</option>
            <option value="pending" {{ 'selected' if filter_status == 'pending' else '' }}>Pending</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Apply</button>
</form>

<div id="beneficiaries-results">
{% include '_beneficiaries_rows.html' %}
</div>

<style>
.badge { display:inline-block; padding:0.2em 0.6em; border-radius:4px; font-size:0.8em; font-weight:600; }
.badge-success { background:var(--success-bg); color:var(--success-text); }
.badge-secondary { background:var(--surface-soft); color:var(--muted); border:1px solid var(--border); }
</style>
{% endblock %}
            <th>Actions</th>
