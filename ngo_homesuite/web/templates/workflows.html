{% extends "base.html" %}

{% block title %}Workflows - NGO HomeSuite{% endblock %}

{% block content %}
<h1>Workflow Runner</h1>
<p class="text-muted">Run opinionated NGO workflows with structured outputs.</p>

<div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem;">
    <div class="card">
        <h3>Donation to Receipt to Follow-up</h3>
        <form method="post" action="{{ url_for('main.workflow_donation_route') }}">
            <div class="form-group">
                <label for="donation_id">Donation ID</label>
                <input type="number" id="donation_id" name="donation_id" min="1" required />
            </div>
            <button class="btn btn-primary" type="submit">Run Flow</button>
        </form>
    </div>

    <div class="card">
        <h3>Grant Application to Reporting</h3>
        <form method="post" action="{{ url_for('main.workflow_grant_route') }}">
            <div class="form-group">
                <label for="grant_name">Grant Name</label>
                <input type="text" id="grant_name" name="grant_name" required />
            </div>
            <div class="form-group">
                <label for="requested_amount">Requested Amount</label>
                <input type="number" id="requested_amount" name="requested_amount" min="0" step="0.01" required />
            </div>
            <button class="btn btn-primary" type="submit">Run Flow</button>
        </form>
    </div>

    <div class="card">
        <h3>Program Tracking to Impact Report</h3>
        <form method="post" action="{{ url_for('main.workflow_program_route') }}">
            <div class="form-group">
                <label for="program_name">Program Name</label>
                <input type="text" id="program_name" name="program_name" required />
            </div>
            <div class="form-group">
                <label for="beneficiary_count">Beneficiary Count</label>
                <input type="number" id="beneficiary_count" name="beneficiary_count" min="0" required />
            </div>
            <button class="btn btn-primary" type="submit">Run Flow</button>
        </form>
    </div>
</div>
{% endblock %}
