{% extends 'base.html' %}
{% block title %}Grant Budget Workbench{% endblock %}
{% block content %}
<section class="page-header">
  <h1>Grant Budget Workbench</h1>
  <p>Create budget lines, record expenses, and compare budget vs actuals.</p>
</section>

<section class="card" style="padding: 1rem; margin-bottom: 1rem;">
  <label for="grantId">Grant ID</label>
  <input id="grantId" type="number" min="1" class="form-control" style="display:block; width:100%; margin-bottom:0.75rem;" />

  <h3>Add Budget Line</h3>
  <input id="lineCategory" class="form-control" placeholder="Category (e.g. staffing)" style="display:block; width:100%; margin-bottom:0.5rem;" />
  <input id="lineName" class="form-control" placeholder="Line name" style="display:block; width:100%; margin-bottom:0.5rem;" />
  <input id="lineAllocated" type="number" step="0.01" class="form-control" placeholder="Allocated amount" style="display:block; width:100%; margin-bottom:0.5rem;" />
  <button id="addLineBtn" class="btn btn-primary" type="button">Add line</button>

  <hr style="margin: 1rem 0;" />

  <h3>Record Expense</h3>
  <input id="expenseLineId" type="number" min="1" class="form-control" placeholder="Budget line ID" style="display:block; width:100%; margin-bottom:0.5rem;" />
  <input id="expenseAmount" type="number" step="0.01" class="form-control" placeholder="Expense amount" style="display:block; width:100%; margin-bottom:0.5rem;" />
  <input id="expenseDescription" class="form-control" placeholder="Description" style="display:block; width:100%; margin-bottom:0.5rem;" />
  <button id="recordExpenseBtn" class="btn btn-outline-primary" type="button">Record expense</button>

  <hr style="margin: 1rem 0;" />
  <button id="loadReportBtn" class="btn btn-outline-secondary" type="button">Load Budget vs Actuals</button>
</section>

<section class="card" style="padding: 1rem;">
  <h2 style="margin-top:0;">Output</h2>
  <pre id="outputBox" style="white-space:pre-wrap; margin:0;">Ready.</pre>
</section>

<script>
(function () {
  const outputBox = document.getElementById('outputBox');

  function grantId() {
    return String(document.getElementById('grantId').value || '').trim();
  }

  async function addLine() {
    const gid = grantId();
    const payload = {
      category: document.getElementById('lineCategory').value,
      line_name: document.getElementById('lineName').value,
      allocated_amount: Number(document.getElementById('lineAllocated').value || 0)
    };
    const resp = await fetch('/admin/grants/' + gid + '/budget/lines', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    outputBox.textContent = JSON.stringify(await resp.json(), null, 2);
  }

  async function recordExpense() {
    const gid = grantId();
    const lineId = String(document.getElementById('expenseLineId').value || '').trim();
    const payload = {
      amount: Number(document.getElementById('expenseAmount').value || 0),
      description: document.getElementById('expenseDescription').value
    };
    const resp = await fetch('/admin/grants/' + gid + '/budget/lines/' + lineId + '/expense', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    outputBox.textContent = JSON.stringify(await resp.json(), null, 2);
  }

  async function loadReport() {
    const gid = grantId();
    const resp = await fetch('/admin/grants/' + gid + '/budget/line-transactions-report');
    outputBox.textContent = JSON.stringify(await resp.json(), null, 2);
  }

  document.getElementById('addLineBtn').addEventListener('click', addLine);
  document.getElementById('recordExpenseBtn').addEventListener('click', recordExpense);
  document.getElementById('loadReportBtn').addEventListener('click', loadReport);
})();
</script>
{% endblock %}
