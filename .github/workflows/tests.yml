name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Migration preflight
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        python -m ngo_homesuite.db.migrate --dry-run --verify-backup

    - name: Run tests
      run: |
        pytest ngo_homesuite/ -v --tb=short --cov=ngo_homesuite --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 ngo_homesuite --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 ngo_homesuite --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check ngo_homesuite/ || true

    - name: Sort imports with isort
      run: |
        isort --check-only ngo_homesuite/ || true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Secret scan (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit

    - name: Run Bandit security checks (high confidence/severity)
      run: |
        bandit -r ngo_homesuite/ -lll -iii

    - name: Check for known vulnerabilities (pip-audit)
      run: |
        pip-audit -r requirements.txt

    - name: Dynamic auth/AI hardening tests
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        pytest ngo_homesuite/ai/test_ai_hardening.py ngo_homesuite/ai/test_copilot_routes.py ngo_homesuite/web/test_auth_security_routes.py -v --maxfail=10

  db-policy:
    name: DB Policy (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [unencrypted, encrypted-policy]

    env:
      NGO_HOMESUITE_DB_KEY: ${{ matrix.mode == 'encrypted-policy' && 'hex:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1' || '' }}
      NGO_HOMESUITE_DB_REQUIRE_HEX_KEY: ${{ matrix.mode == 'encrypted-policy' && '1' || '0' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Migration preflight (DB mode)
      run: |
        python -m ngo_homesuite.db.migrate --dry-run --verify-backup

    - name: Run DB tests
      run: |
        pytest ngo_homesuite/db -v --maxfail=10

  critical-paths:
    name: Critical Paths (donations/audit/encryption)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run critical path tests
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        pytest ngo_homesuite/web/test_sprint1_features.py ngo_homesuite/db/test_utils_audit.py ngo_homesuite/db/test_connection_hardening.py -v --maxfail=10

  openapi-contract:
    name: OpenAPI Contract + Client Generation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install OpenAPI tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install openapi-spec-validator openapi-python-client

    - name: Validate OpenAPI document
      run: |
        python - <<'PY'
        from pathlib import Path
        import yaml
        from openapi_spec_validator import validate_spec

        spec = yaml.safe_load(Path("docs/openapi.yaml").read_text(encoding="utf-8"))
        validate_spec(spec)
        print("OpenAPI validation passed")
        PY

    - name: Run OpenAPI contract tests
      run: |
        pytest ngo_homesuite/api/test_openapi_contract.py ngo_homesuite/web/test_api_docs_routes.py -v --maxfail=10

    - name: Generate Python client from OpenAPI
      run: |
        rm -rf .openapi-client
        openapi-python-client generate --path docs/openapi.yaml --meta none --output-path .openapi-client

    - name: Upload generated client artifact
      uses: actions/upload-artifact@v4
      with:
        name: openapi-python-client
        path: .openapi-client
