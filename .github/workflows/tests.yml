name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Migration preflight
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        python -m ngo_homesuite.db.migrate --dry-run --verify-backup

    - name: Verify observability deployment artifacts
      run: |
        python - <<'PY'
        from pathlib import Path

        required = [
            "deploy/monitoring/prometheus.yml",
            "deploy/monitoring/alerts.yml",
            "deploy/monitoring/promtail-config.yml",
            "deploy/monitoring/docker-compose.monitoring.yml",
            "docs/observability_stack.md",
        ]
        missing = [path for path in required if not Path(path).exists()]
        if missing:
            raise SystemExit(f"Missing observability artifact(s): {missing}")
        print("Observability artifact check passed")
        PY

    - name: Backup/restore drill smoke (non-prod)
      run: |
        python - <<'PY'
        import sqlite3
        from pathlib import Path

        from ngo_homesuite.db.backup_restore_drill import run_backup_restore_drill

        tmp = Path(".ci-drill")
        tmp.mkdir(parents=True, exist_ok=True)
        source = tmp / "source.sqlite3"
        with sqlite3.connect(str(source)) as conn:
            conn.execute("CREATE TABLE IF NOT EXISTS healthcheck (id INTEGER PRIMARY KEY, value TEXT)")
            conn.execute("INSERT INTO healthcheck (value) VALUES ('ok')")
            conn.commit()

        result = run_backup_restore_drill(str(source), str(tmp / "outputs"))
        assert result["integrity"] == "ok"
        print("Backup/restore drill smoke passed")
        PY

    - name: PyProject / Requirements drift guard
      run: |
        python tools/check_pyproject_requirements_drift.py

    - name: Dependency drift guard
      run: |
        python tools/check_dependency_drift.py

    - name: Verify dependency policy artifact
      run: |
        python - <<'PY'
        from pathlib import Path

        path = Path("docs/dependency_policy.md")
        if not path.exists():
            raise SystemExit("Missing docs/dependency_policy.md")
        print("Dependency policy artifact check passed")
        PY

    - name: Validate release evidence bundle schema
      run: |
        python tools/verify_release_evidence_bundle.py

    - name: Check OpenAPI route drift (required v2 surface)
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        python tools/check_openapi_route_drift.py

    - name: Run tests
      run: |
        pytest ngo_homesuite/ -v --tb=short --cov=ngo_homesuite --cov-report=xml

    - name: Workflow reliability failure-injection lane
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        pytest ngo_homesuite/tests/test_workflow_reliability_failure_injection.py ngo_homesuite/persistence/test_workflow_repository_concurrency.py ngo_homesuite/tests/test_donation_fund_concurrency.py -v --maxfail=10

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 ngo_homesuite --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 ngo_homesuite --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: |
        black --check ngo_homesuite/ || true

    - name: Sort imports with isort
      run: |
        isort --check-only ngo_homesuite/ || true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Secret scan (Gitleaks)
      uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit

    - name: Run Bandit security checks (high confidence/severity)
      run: |
        bandit -r ngo_homesuite/ -lll -iii

    - name: Check for known vulnerabilities (pip-audit)
      run: |
        pip-audit -r requirements.txt

    - name: Dynamic auth/AI hardening tests
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        pytest ngo_homesuite/ai/test_ai_hardening.py ngo_homesuite/ai/test_copilot_routes.py ngo_homesuite/web/test_auth_security_routes.py ngo_homesuite/web/test_public_smoke_paths.py ngo_homesuite/web/test_cross_tenant_boundaries.py ngo_homesuite/web/test_v2_route_contracts.py ngo_homesuite/web/test_rbac_tenant_route_audit.py ngo_homesuite/db/test_connection.py ngo_homesuite/db/test_connection_hardening.py -v --maxfail=10

  workflow-supply-chain-policy:
    name: Workflow Supply Chain Policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Enforce SHA-pinned third-party actions
      run: |
        pytest ngo_homesuite/test_workflow_action_pinning_policy.py -v --maxfail=1

  tenant-boundary-gate:
    name: Tenant Boundary Gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run cross-tenant boundary tests
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        pytest ngo_homesuite/web/test_cross_tenant_boundaries.py ngo_homesuite/web/test_v2_route_contracts.py ngo_homesuite/web/test_rbac_tenant_route_audit.py ngo_homesuite/api/test_v1_runtime.py -v --maxfail=10

  docker-matrix-ci:
    name: Docker Matrix CI [${{ matrix.db-mode }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db-mode: ["plaintext", "sqlcipher"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db

    - name: Build Docker image (${{ matrix.db-mode }})
      run: |
        if [ "${{ matrix.db-mode }}" = "plaintext" ]; then
          docker build -f Dockerfile.ci -t ngo-homesuite:test-plaintext .
          docker run --rm ngo-homesuite:test-plaintext
        else
          docker build -f Dockerfile.ci-sqlcipher -t ngo-homesuite:test-sqlcipher .
          docker run --rm ngo-homesuite:test-sqlcipher
        fi

    - name: Extract coverage from Docker
      if: always()
      run: |
        if [ "${{ matrix.db-mode }}" = "plaintext" ]; then
          docker create --name extract ngo-homesuite:test-plaintext
        else
          docker create --name extract ngo-homesuite:test-sqlcipher
        fi
        docker cp extract:/app/coverage.xml ./coverage-${{ matrix.db-mode }}.xml || true
        docker rm extract

    - name: Upload Docker test coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-docker-${{ matrix.db-mode }}
        path: coverage-${{ matrix.db-mode }}.xml
        retention-days: 5

  container-security:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -t ngo-homesuite:ci .

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
      with:
        image-ref: ngo-homesuite:ci
        format: table
        exit-code: 1
        ignore-unfixed: true
        severity: CRITICAL,HIGH

  db-policy:
    name: DB Policy (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [unencrypted, encrypted-policy]

    env:
      NGO_HOMESUITE_DB_KEY: ${{ matrix.mode == 'encrypted-policy' && 'hex:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1' || '' }}
      NGO_HOMESUITE_DB_REQUIRE_HEX_KEY: ${{ matrix.mode == 'encrypted-policy' && '1' || '0' }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Migration preflight (DB mode)
      run: |
        python -m ngo_homesuite.db.migrate --dry-run --verify-backup

    - name: Run DB tests
      run: |
        pytest ngo_homesuite/db -v --maxfail=10

  critical-paths:
    name: Critical Paths (donations/audit/encryption)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run critical path tests
      env:
        NGO_HOMESUITE_DB_KEY: ""
      run: |
        pytest ngo_homesuite/web/test_sprint1_features.py ngo_homesuite/db/test_utils_audit.py ngo_homesuite/db/test_connection_hardening.py -v --maxfail=10

  openapi-contract:
    name: OpenAPI Contract + Client Generation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install OpenAPI tooling
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install openapi-spec-validator openapi-python-client

    - name: Validate OpenAPI document
      run: |
        python - <<'PY'
        from pathlib import Path
        import yaml
        from openapi_spec_validator import validate_spec

        spec = yaml.safe_load(Path("docs/openapi.yaml").read_text(encoding="utf-8"))
        validate_spec(spec)
        print("OpenAPI validation passed")
        PY

    - name: Run OpenAPI contract tests
      run: |
        pytest ngo_homesuite/api/test_openapi_contract.py ngo_homesuite/web/test_api_docs_routes.py -v --maxfail=10

    - name: Generate Python client from OpenAPI
      run: |
        rm -rf .openapi-client
        openapi-python-client generate --path docs/openapi.yaml --meta none --output-path .openapi-client

    - name: Upload generated client artifact
      uses: actions/upload-artifact@v4
      with:
        name: openapi-python-client
        path: .openapi-client

  performance-smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start local app
      env:
        SECRET_KEY: perf-smoke-secret
        DATABASE_URL: 'sqlite:///:memory:'
        FLASK_ENV: development
        WTF_CSRF_ENABLED: '0'
      run: |
        python - <<'PY' &
        from ngo_homesuite.app_factory import create_app
        from ngo_homesuite.flask_config import TestingConfig

        app = create_app(TestingConfig)
        app.run(host='127.0.0.1', port=8765, use_reloader=False)
        PY
        sleep 5

    - name: Run load smoke
      run: |
        python tools/load_test_smoke.py --base-url http://127.0.0.1:8765 --endpoint /health --endpoint / --endpoint /give --total-requests 45 --concurrency 5 --max-p95-ms 2000

  dast-smoke:
    name: DAST Smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start local app
      env:
        SECRET_KEY: dast-smoke-secret
        DATABASE_URL: 'sqlite:///:memory:'
        FLASK_ENV: development
        WTF_CSRF_ENABLED: '0'
      run: |
        python - <<'PY' &
        from ngo_homesuite.app_factory import create_app
        from ngo_homesuite.flask_config import TestingConfig

        app = create_app(TestingConfig)
        app.run(host='127.0.0.1', port=8765, use_reloader=False)
        PY
        sleep 5

    - name: Run DAST smoke checks
      run: |
        mkdir -p artifacts
        python tools/dast_smoke.py --base-url http://127.0.0.1:8765 --report-json artifacts/dast-smoke-report.json

    - name: Upload DAST smoke report
      uses: actions/upload-artifact@v4
      with:
        name: dast-smoke-report
        path: artifacts/dast-smoke-report.json

  scalability-benchmark:
    name: Scalability Benchmark
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start local app
      env:
        SECRET_KEY: benchmark-secret
        DATABASE_URL: 'sqlite:///:memory:'
        FLASK_ENV: development
        WTF_CSRF_ENABLED: '0'
      run: |
        python - <<'PY' &
        from ngo_homesuite.app_factory import create_app
        from ngo_homesuite.flask_config import TestingConfig

        app = create_app(TestingConfig)
        app.run(host='127.0.0.1', port=8765, use_reloader=False)
        PY
        sleep 5

    - name: Run scalability benchmark
      run: |
        mkdir -p artifacts
        python tools/scalability_benchmark.py --base-url http://127.0.0.1:8765 --endpoint /health --endpoint / --endpoint /give --endpoint /p2p/leaderboard --total-requests 300 --concurrency 20 --max-overall-p95-ms 2200 --report-json artifacts/scalability-benchmark.json

    - name: Check benchmark regression against baseline
      run: |
        python tools/check_benchmark_regression.py --report-json artifacts/scalability-benchmark.json --baseline-json tools/benchmark_baseline.json --max-p95-drift-pct 35 --summary-json artifacts/scalability-regression-summary.json

    - name: Upload scalability benchmark report
      uses: actions/upload-artifact@v4
      with:
        name: scalability-benchmark-report
        path: artifacts/scalability-benchmark.json

    - name: Upload scalability regression summary
      uses: actions/upload-artifact@v4
      with:
        name: scalability-regression-summary
        path: artifacts/scalability-regression-summary.json
