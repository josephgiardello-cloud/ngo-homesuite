name: Candidate Database Isolation

on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-isolation:
    name: Isolation (${{ matrix.engine }})
    runs-on: ubuntu-latest
    env:
      CANDIDATE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, sqlite_sqlcipher]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tenant_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenant_proof"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install declared dependencies and real encryption adapter
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pytest-timeout sqlcipher3-binary==0.6.0
      - name: Persisted engine isolation, migrations and encryption proof
        env:
          ENGINE: ${{ matrix.engine }}
          NGO_HOMESUITE_REQUIRE_SQLCIPHER_TESTS: "1"
        run: |
          mkdir -p candidate-evidence
          if [ "$ENGINE" = "postgresql" ]; then
            export TENANT_TEST_DATABASE_URL="postgresql+psycopg://postgres@localhost:5432/tenant_proof"
            export REQUIRE_POSTGRES_TENANT_PROOF=1
            pytest -o addopts= ngo_homesuite/tests/test_tenant_sql_boundary.py --junitxml=candidate-evidence/tenant.xml
          else
            export TENANT_TEST_SQLCIPHER=1
            pytest -o addopts= ngo_homesuite/tests/test_tenant_sql_boundary.py -k "not postgres_migration" --junitxml=candidate-evidence/tenant.xml
          fi
          pytest -o addopts= ngo_homesuite/db/test_sqlcipher_adapter.py ngo_homesuite/db/test_connection.py --junitxml=candidate-evidence/encryption.xml
          python tools/write_candidate_evidence.py --directory candidate-evidence --engine "$ENGINE"
      - name: Upload exact-SHA engine proof
        uses: actions/upload-artifact@v4
        with:
          name: isolation-${{ matrix.engine }}-${{ env.CANDIDATE_COMMIT_SHA }}
          path: candidate-evidence/
          if-no-files-found: error
