name: Full-history secret scan
description: Scan every fetched Git ref rather than only the pull-request range.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse --is-shallow-repository)" = "false"
        scanner_dir="$(mktemp -d)"
        trap 'rm -rf "$scanner_dir"' EXIT
        base="https://github.com/gitleaks/gitleaks/releases/download/v8.24.3"
        curl --fail --location "$base/gitleaks_8.24.3_linux_x64.tar.gz" -o "$scanner_dir/gitleaks_8.24.3_linux_x64.tar.gz"
        curl --fail --location "$base/gitleaks_8.24.3_checksums.txt" -o "$scanner_dir/checksums.txt"
        (cd "$scanner_dir"; grep ' gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict)
        tar -xzf "$scanner_dir/gitleaks_8.24.3_linux_x64.tar.gz" -C "$scanner_dir" gitleaks
        "$scanner_dir/gitleaks" git . --log-opts="--all" --redact --verbose
