openapi: 3.0.3
info:
  title: NGO HomeSuite API
  version: 0.1.0-beta
  description: |
    Starter OpenAPI contract for internal/beta integrations.
    This contract emphasizes stable operationIds and reusable schemas to support
    downstream tooling (client generation, docs, and contract checks).
servers:
  - url: /
paths:
  /api/docs:
    get:
      operationId: getApiDocsIndex
      summary: API docs landing page
      tags: [Docs]
      responses:
        '200':
          description: HTML docs landing page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/swagger:
    get:
      operationId: getApiSwaggerUi
      summary: Interactive Swagger UI page
      tags: [Docs]
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: OpenAPI specification
      tags: [Docs]
      responses:
        '200':
          description: YAML OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/compliance/evidence:
    get:
      operationId: getComplianceEvidence
      summary: Export compliance evidence packet
      tags: [Compliance]
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [org]
          required: false
          description: Evidence scope (defaults to org)
        - in: query
          name: download
          schema:
            type: integer
            enum: [0, 1]
          required: false
          description: Set to 1 to force file download
      responses:
        '200':
          description: Compliance evidence payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceEvidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/domain/snapshot:
    get:
      operationId: getDomainSnapshot
      summary: Build and return current NGO domain entity graph snapshot
      tags: [Domain]
      responses:
        '200':
          description: Domain snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/semantic/context:
    get:
      operationId: getSemanticTaskContext
      summary: Build semantic context for a task from the domain graph
      tags: [AI]
      parameters:
        - in: query
          name: task
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assembled semantic context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflows/donation/{donationId}/run:
    post:
      operationId: postRunDonationWorkflow
      summary: Run donation receipt and follow-up workflow
      tags: [Workflows]
      parameters:
        - in: path
          name: donationId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Donation workflow result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflows/grant/run:
    post:
      operationId: postRunGrantWorkflow
      summary: Run grant tracking and reporting workflow
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunGrantWorkflowRequest'
      responses:
        '200':
          description: Grant workflow result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflows/program-impact/run:
    post:
      operationId: postRunProgramImpactWorkflow
      summary: Run program impact scoring workflow
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunProgramWorkflowRequest'
      responses:
        '200':
          description: Program workflow result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workflows:
    get:
      operationId: getV1WorkflowDefinitions
      summary: List deterministic workflow definitions in V2 runtime
      tags: [WorkflowsV1]
      responses:
        '200':
          description: Workflow definition list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  workflow_types:
                    type: array
                    items:
                      type: string
                required: [ok, workflow_types]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows/instances:
    post:
      operationId: postV1CreateWorkflowInstance
      summary: Create a workflow instance
      tags: [WorkflowsV1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowInstanceRequest'
      responses:
        '200':
          description: Created workflow instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1WorkflowInstanceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workflows/instances/{instanceId}/events:
    post:
      operationId: postV1ApplyWorkflowEvent
      summary: Apply event transition to workflow instance
      tags: [WorkflowsV1]
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyWorkflowEventRequest'
      responses:
        '200':
          description: Updated workflow instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1WorkflowInstanceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows/instances/{instanceId}/trace:
    get:
      operationId: getV1WorkflowTrace
      summary: Get execution trace for workflow instance
      tags: [WorkflowsV1]
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow execution trace
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Trace not found
  /api/v1/audit/events:
    get:
      operationId: getV1AuditEvents
      summary: List append-only audit events for an org
      tags: [AuditV1]
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit event list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ai/copilot/chat:
    post:
      operationId: postCopilotChat
      summary: Query HomeSuite Copilot
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotChatRequest'
      responses:
        '200':
          description: Copilot response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ComplianceEvidence:
      type: object
      properties:
        schema:
          type: string
        sha256:
          type: string
        security_posture:
          type: object
          additionalProperties: true
        data_inventory:
          type: object
          additionalProperties: true
      required: [schema, sha256]
    CopilotActionApprovalItem:
      type: object
      properties:
        tool:
          type: string
        token:
          type: string
      required: [tool]
    CopilotChatRequest:
      type: object
      properties:
        prompt:
          type: string
        context:
          type: object
          additionalProperties: true
        allow_actions:
          type: boolean
        approved_actions:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/CopilotActionApprovalItem'
      required: [prompt]
    SourceSnippet:
      type: object
      additionalProperties: true
    ToolAction:
      type: object
      additionalProperties: true
    DomainSnapshotResponse:
      type: object
      properties:
        ok:
          type: boolean
        organization:
          type: string
          nullable: true
        entities:
          type: object
          additionalProperties: true
      required: [ok, entities]
    SemanticContext:
      type: object
      properties:
        task:
          type: string
        generated_at:
          type: string
        entity_count:
          type: integer
        retrieved_entities:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [task, generated_at, entity_count, retrieved_entities]
    SemanticContextResponse:
      type: object
      properties:
        ok:
          type: boolean
        context:
          $ref: '#/components/schemas/SemanticContext'
      required: [ok, context]
    WorkflowResult:
      type: object
      properties:
        ok:
          type: boolean
        workflow:
          type: string
        error:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required: [ok]
    RunGrantWorkflowRequest:
      type: object
      properties:
        grant_name:
          type: string
        requested_amount:
          type: number
      required: [grant_name]
    RunProgramWorkflowRequest:
      type: object
      properties:
        program_name:
          type: string
        beneficiary_count:
          type: integer
        outcomes:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [program_name]
    CreateWorkflowInstanceRequest:
      type: object
      properties:
        org_id:
          type: string
        workflow_type:
          type: string
      required: [org_id, workflow_type]
    ApplyWorkflowEventRequest:
      type: object
      properties:
        org_id:
          type: string
        event_type:
          type: string
        actor_id:
          type: string
        role:
          type: string
        payload:
          type: object
          additionalProperties: true
      required: [org_id, event_type, actor_id, role]
    V1WorkflowInstance:
      type: object
      properties:
        instance_id:
          type: string
        org_id:
          type: string
        workflow_type:
          type: string
        current_step:
          type: string
        status:
          type: string
        history:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [instance_id, org_id, workflow_type, current_step, status]
    V1WorkflowInstanceEnvelope:
      type: object
      properties:
        ok:
          type: boolean
        instance:
          $ref: '#/components/schemas/V1WorkflowInstance'
      required: [ok, instance]
    CopilotChatResponse:
      type: object
      properties:
        response:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceSnippet'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ToolAction'
        redactions:
          type: integer
        mode:
          type: string
      required: [response, sources, actions, mode]
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service unavailable or disabled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: session
security:
  - sessionCookieAuth: []
