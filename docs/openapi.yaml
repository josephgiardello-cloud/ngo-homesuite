openapi: 3.0.3
info:
  title: NGO HomeSuite API
  version: 0.1.0-beta
  description: |
    Starter OpenAPI contract for internal/beta integrations.
    This contract emphasizes stable operationIds and reusable schemas to support
    downstream tooling (client generation, docs, and contract checks).
servers:
  - url: /
paths:
  /api/docs:
    get:
      operationId: getApiDocsIndex
      summary: API docs landing page
      tags: [Docs]
      responses:
        '200':
          description: HTML docs landing page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/swagger:
    get:
      operationId: getApiSwaggerUi
      summary: Interactive Swagger UI page
      tags: [Docs]
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: OpenAPI specification
      tags: [Docs]
      responses:
        '200':
          description: YAML OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/compliance/evidence:
    get:
      operationId: getComplianceEvidence
      summary: Export compliance evidence packet
      tags: [Compliance]
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [org]
          required: false
          description: Evidence scope (defaults to org)
        - in: query
          name: download
          schema:
            type: integer
            enum: [0, 1]
          required: false
          description: Set to 1 to force file download
      responses:
        '200':
          description: Compliance evidence payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceEvidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/domain/snapshot:
    get:
      operationId: getDomainSnapshot
      summary: Build and return current NGO domain entity graph snapshot
      tags: [Domain]
      responses:
        '200':
          description: Domain snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/semantic/context:
    get:
      operationId: getSemanticTaskContext
      summary: Build semantic context for a task from the domain graph
      tags: [AI]
      parameters:
        - in: query
          name: task
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assembled semantic context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflows/donation/{donationId}/run:
    post:
      operationId: postRunDonationWorkflow
      summary: Run donation receipt and follow-up workflow
      tags: [Workflows]
      parameters:
        - in: path
          name: donationId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Donation workflow result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflows/grant/run:
    post:
      operationId: postRunGrantWorkflow
      summary: Run grant tracking and reporting workflow
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunGrantWorkflowRequest'
      responses:
        '200':
          description: Grant workflow result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/workflows/program-impact/run:
    post:
      operationId: postRunProgramImpactWorkflow
      summary: Run program impact scoring workflow
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunProgramWorkflowRequest'
      responses:
        '200':
          description: Program workflow result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workflows:
    get:
      operationId: getV1WorkflowDefinitions
      summary: List deterministic workflow definitions in V2 runtime
      tags: [WorkflowsV1]
      responses:
        '200':
          description: Workflow definition list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  workflow_types:
                    type: array
                    items:
                      type: string
                required: [ok, workflow_types]
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows/instances:
    post:
      operationId: postV1CreateWorkflowInstance
      summary: Create a workflow instance
      tags: [WorkflowsV1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowInstanceRequest'
      responses:
        '200':
          description: Created workflow instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1WorkflowInstanceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workflows/instances/{instanceId}/events:
    post:
      operationId: postV1ApplyWorkflowEvent
      summary: Apply event transition to workflow instance
      tags: [WorkflowsV1]
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyWorkflowEventRequest'
      responses:
        '200':
          description: Updated workflow instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1WorkflowInstanceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows/instances/{instanceId}/trace:
    get:
      operationId: getV1WorkflowTrace
      summary: Get execution trace for workflow instance
      tags: [WorkflowsV1]
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow execution trace
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Trace not found
  /api/v1/audit/events:
    get:
      operationId: getV1AuditEvents
      summary: List append-only audit events for an org
      tags: [AuditV1]
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit event list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/campaigns/{campaignId}/emails/send:
    post:
      operationId: postV2CampaignEmailsSend
      summary: Send or schedule campaign bulk email delivery
      tags: [CampaignsV2]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignEmailSendRequest'
            examples:
              advancedAudience:
                summary: Send to advanced segmented audience
                value:
                  subject: Quarterly impact update
                  body: "Hi {name}, your support powers {campaign_name}."
                  audience:
                    donor_types: [individual]
                    min_total_given: 300
                    max_total_given: 1500
                    min_gift_count: 2
                    max_gift_count: 8
                    gifted_between_days_min: 7
                    gifted_between_days_max: 180
                    lapsed_days_min: 30
                  compliance:
                    reviewer_name: Ops Reviewer
                    reviewer_role: Staff
                  dry_run: false
      responses:
        '200':
          description: Campaign email send accepted and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEmailSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Campaign not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/campaigns/{campaignId}/emails/preview:
    post:
      operationId: postV2CampaignEmailsPreview
      summary: Preview campaign email recipients and personalization data
      tags: [CampaignsV2]
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignEmailPreviewRequest'
            examples:
              previewWithBands:
                summary: Preview with advanced recency and giving filters
                value:
                  subject: Filtered preview message
                  body: "Hi {name}, here is your impact update for {campaign_name}."
                  audience:
                    min_total_given: 300
                    max_total_given: 500
                    min_gift_count: 2
                    max_gift_count: 3
                    gifted_between_days_min: 1
                    gifted_between_days_max: 90
      responses:
        '200':
          description: Email preview payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEmailPreviewResponse'
              examples:
                filteredPreview:
                  summary: Preview response with breakdown and audience echo
                  value:
                    campaign_id: 42
                    campaign_name: Spring Appeal
                    total_recipients: 1
                    segment_breakdown:
                      individual: 1
                    recipient_breakdown:
                      by_donor_type:
                        individual: 1
                      by_total_giving_band:
                        0-99: 0
                        100-499: 1
                        500-999: 0
                        1000+: 0
                      by_gift_count_band:
                        '0': 0
                        '1': 0
                        2-5: 1
                        6+: 0
                      by_recency_band:
                        0-30d: 1
                        31-90d: 0
                        91-365d: 0
                        365d+: 0
                        never: 0
                    audience_applied:
                      min_total_given: 300
                      max_total_given: 500
                      min_gift_count: 2
                      max_gift_count: 3
                      gifted_between_days_min: 1
                      gifted_between_days_max: 90
                    quality_hints:
                      - Subject is shorter than recommended 5 characters.
                    sample_preview:
                      - donor_id: 1001
                        donor_name: Preview Match
                        recipient_email: preview-match@example.org
                        subject: Filtered preview message
                        body: Hi Preview Match, here is your impact update for Spring Appeal.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Campaign not found
  /api/v2/campaigns/email/unsubscribe:
    get:
      operationId: getV2CampaignEmailUnsubscribe
      summary: Process signed unsubscribe links from campaign emails
      tags: [CampaignsV2Public]
      responses:
        '200':
          description: HTML unsubscribe confirmation
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid or expired unsubscribe link
        '404':
          description: Campaign not found
  /api/v2/campaigns/email/click:
    get:
      operationId: getV2CampaignEmailClick
      summary: Record tracked click event and redirect
      tags: [CampaignsV2Public]
      responses:
        '302':
          description: Redirect to tracked target URL
        '400':
          description: Invalid or expired tracking token
        '404':
          description: Tracking record not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/campaigns/email/open-pixel:
    get:
      operationId: getV2CampaignEmailOpenPixel
      summary: Record tracked open event and return transparent pixel
      tags: [CampaignsV2Public]
      responses:
        '200':
          description: 1x1 GIF tracking pixel
          content:
            image/gif:
              schema:
                type: string
                format: binary
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v2/collab/channels:
    get:
      operationId: getV2CollabChannels
      summary: List collaboration channels visible to the current user
      tags: [CollaborationV2]
      responses:
        '200':
          description: Collaboration channels payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postV2CollabChannels
      summary: Create a collaboration channel
      tags: [CollaborationV2]
      responses:
        '201':
          description: Collaboration channel created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/collab/channels/{channel_id}/messages:
    get:
      operationId: getV2CollabChannelMessages
      summary: List messages for a collaboration channel
      tags: [CollaborationV2]
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Channel messages payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Channel not found
    post:
      operationId: postV2CollabChannelMessages
      summary: Post a message to a collaboration channel
      tags: [CollaborationV2]
      parameters:
        - in: path
          name: channel_id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Message created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Channel not found
  /api/v2/collab/presence:
    get:
      operationId: getV2CollabPresence
      summary: List collaboration presence states
      tags: [CollaborationV2]
      responses:
        '200':
          description: Presence payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: postV2CollabPresence
      summary: Upsert the current user presence state
      tags: [CollaborationV2]
      responses:
        '200':
          description: Presence updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/membership/members:
    get:
      operationId: getV2MembershipMembers
      summary: List members with filter, search, and pagination
      tags: [MembershipV2]
      responses:
        '200':
          description: Membership member list payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/donor-journeys/automations/run:
    post:
      operationId: postV2DonorJourneyAutomationsRun
      summary: Run donor journey automations
      tags: [DonorJourneysV2]
      responses:
        '200':
          description: Automation execution payload
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/donor-journeys/automations/events:
    get:
      operationId: getV2DonorJourneyAutomationEvents
      summary: List donor journey automation events
      tags: [DonorJourneysV2]
      responses:
        '200':
          description: Donor journey automation event payload
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/forms/submissions/public:
    post:
      operationId: postV2PublicFormSubmission
      summary: Submit public form payload via token-auth endpoint
      tags: [FormsV2Public]
      responses:
        '201':
          description: Form submission accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/intelligence/dashboard:
    get:
      operationId: getV2IntelligenceDashboard
      summary: Get role-based intelligence dashboard payload
      tags: [IntelligenceV2]
      responses:
        '200':
          description: Role-based intelligence dashboard payload
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/intelligence/financial-guardrails:
    get:
      operationId: getV2IntelligenceFinancialGuardrails
      summary: Get financial guardrails intelligence payload
      tags: [IntelligenceV2]
      responses:
        '200':
          description: Financial guardrails intelligence payload
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v2/campaigns/{campaign_id}/emails/send:
    post:
      operationId: postV2CampaignEmailSend
      summary: Send campaign email batches
      tags: [CampaignsV2]
      parameters:
        - in: path
          name: campaign_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Campaign email send payload
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Campaign not found
  /ai/copilot/chat:
    post:
      operationId: postCopilotChat
      summary: Query HomeSuite Copilot
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotChatRequest'
      responses:
        '200':
          description: Copilot response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ComplianceEvidence:
      type: object
      properties:
        schema:
          type: string
        sha256:
          type: string
        security_posture:
          type: object
          additionalProperties: true
        data_inventory:
          type: object
          additionalProperties: true
      required: [schema, sha256]
    CopilotActionApprovalItem:
      type: object
      properties:
        tool:
          type: string
        token:
          type: string
      required: [tool]
    CopilotChatRequest:
      type: object
      properties:
        prompt:
          type: string
        context:
          type: object
          additionalProperties: true
        allow_actions:
          type: boolean
        approved_actions:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/CopilotActionApprovalItem'
      required: [prompt]
    SourceSnippet:
      type: object
      additionalProperties: true
    ToolAction:
      type: object
      additionalProperties: true
    DomainSnapshotResponse:
      type: object
      properties:
        ok:
          type: boolean
        organization:
          type: string
          nullable: true
        entities:
          type: object
          additionalProperties: true
      required: [ok, entities]
    SemanticContext:
      type: object
      properties:
        task:
          type: string
        generated_at:
          type: string
        entity_count:
          type: integer
        retrieved_entities:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [task, generated_at, entity_count, retrieved_entities]
    SemanticContextResponse:
      type: object
      properties:
        ok:
          type: boolean
        context:
          $ref: '#/components/schemas/SemanticContext'
      required: [ok, context]
    WorkflowResult:
      type: object
      properties:
        ok:
          type: boolean
        workflow:
          type: string
        error:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required: [ok]
    RunGrantWorkflowRequest:
      type: object
      properties:
        grant_name:
          type: string
        requested_amount:
          type: number
      required: [grant_name]
    RunProgramWorkflowRequest:
      type: object
      properties:
        program_name:
          type: string
        beneficiary_count:
          type: integer
        outcomes:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [program_name]
    CreateWorkflowInstanceRequest:
      type: object
      properties:
        org_id:
          type: string
        workflow_type:
          type: string
      required: [org_id, workflow_type]
    ApplyWorkflowEventRequest:
      type: object
      properties:
        org_id:
          type: string
        event_type:
          type: string
        actor_id:
          type: string
        role:
          type: string
        payload:
          type: object
          additionalProperties: true
      required: [org_id, event_type, actor_id, role]
    V1WorkflowInstance:
      type: object
      properties:
        instance_id:
          type: string
        org_id:
          type: string
        workflow_type:
          type: string
        current_step:
          type: string
        status:
          type: string
        history:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [instance_id, org_id, workflow_type, current_step, status]
    V1WorkflowInstanceEnvelope:
      type: object
      properties:
        ok:
          type: boolean
        instance:
          $ref: '#/components/schemas/V1WorkflowInstance'
      required: [ok, instance]
    CopilotChatResponse:
      type: object
      properties:
        response:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceSnippet'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ToolAction'
        redactions:
          type: integer
        mode:
          type: string
      required: [response, sources, actions, mode]
    CampaignEmailAudience:
      type: object
      properties:
        donor_ids:
          type: array
          items:
            type: integer
        donor_types:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        smart_group_id:
          type: integer
        smart_group_rules:
          type: array
          items:
            type: object
            additionalProperties: true
        min_total_given:
          type: number
          minimum: 0
        max_total_given:
          type: number
          minimum: 0
        gifted_within_days:
          type: integer
          minimum: 0
        lapsed_days_min:
          type: integer
          minimum: 0
        min_gift_count:
          type: integer
          minimum: 0
        max_gift_count:
          type: integer
          minimum: 0
        gifted_between_days_min:
          type: integer
          minimum: 0
        gifted_between_days_max:
          type: integer
          minimum: 0
      additionalProperties: true
    CampaignEmailSendRequest:
