[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-homesuite"
version = "0.2.1"
description = "Multi-tenant NGO operations platform with workflow runtime, audit trails, and AI copilot support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "NGO HomeSuite Contributors"}
]
keywords = ["nonprofit", "ngo", "flask", "workflow", "audit", "donations"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Flask==3.1.2",
  "Flask-Login==0.6.3",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-Migrate==4.0.7",
  "Flask-WTF==1.3.0",
  "Flask-CKEditor==0.5.1",
  "Flask-Babel==4.0.0",
  "Flask-Limiter==4.1.1",
  "Flask-Session==0.8.0",
  "authlib>=1.3.0",
  "APScheduler==3.10.4",
  "Pydantic==2.9.2",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "greenlet==3.3.0",
  "WTForms==3.1.2",
  "email-validator==2.3.0",
  "zxcvbn==4.5.0",
  "cryptography==46.0.3",
  "argon2-cffi==25.1.0",
  "bcrypt==4.2.1",
  "pyotp==2.9.0",
  "python-dotenv==1.0.1",
  "portalocker==3.2.0",
  "prometheus-client==0.21.1",
  "requests==2.34.2",
  "chardet==5.2.0",
  "psycopg[binary]==3.2.9",
  "psycopg2-binary==2.9.12",
  "PyMySQL==1.1.3",
  "ollama==0.6.0",
  "langchain==0.3.27",
  "langchain-ollama==1.1.0",
  "langchain-community==0.3.27",
  "chromadb==0.5.5",
  "pypdf==5.9.0",
  "python-dateutil==2.9.0.post0",
  "reportlab==4.5.1",
  "boto3==1.42.18",
  "botocore==1.43.9",
  "azure-identity==1.25.1",
  "azure-keyvault-keys==4.11.0",
  "stripe>=8.0.0",
  "gunicorn==22.0.0",
  "openpyxl==3.1.5",
  "numpy>=2.4.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "PyPDF2>=3.0.0",
  "webauthn>=2.0.0",
  "scikit-learn>=1.5.0",
  "redis==5.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.1.0",
  "pytest-asyncio==0.25.2",
  "black==25.1.0",
  "flake8==7.1.1",
  "isort==5.13.2",
  "mypy==2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ngo_homesuite*"]
