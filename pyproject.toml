[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-homesuite"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10", "hypothesis>=6.125,<7", "httpx>=0.28,<1",
  "playwright>=1.50,<2", "ruff>=0.11,<1", "mypy>=1.15,<2",
  "pip-audit>=2.8,<3", "detect-secrets>=1.5,<2",
]

[tool.setuptools.packages.find]
include = ["ngo_homesuite*", "backend*"]

[tool.setuptools.package-data]
"backend.app" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: critical browser journeys (requires Chromium)"]
addopts = "-m 'not browser'"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Existing compatibility re-exports and pre-existing unused imports, outside this release scope.
"ngo_homesuite/db/utils.py" = ["F401"]
"ngo_homesuite/main.py" = ["F401"]
"ngo_homesuite/models/pledge.py" = ["F401"]
"ngo_homesuite/utils/backup_core.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
files = ["ngo_homesuite/domain", "backend", "ngo_homesuite/db/schema.py"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pysqlcipher3.*"]
ignore_missing_imports = true
