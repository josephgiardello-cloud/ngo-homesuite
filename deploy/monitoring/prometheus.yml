global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ngo_homesuite_app
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - app:8000

    # Provide credentials via deployment automation/secrets manager.
    basic_auth:
      username: observability
      password: CHANGE_ME
