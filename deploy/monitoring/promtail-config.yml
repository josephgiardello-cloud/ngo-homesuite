server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ngo_homesuite_logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: ngo-homesuite
          env: production
          __path__: /var/log/ngo_homesuite/*.log
