version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ngo-homesuite-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: ngo-homesuite-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: ngo-homesuite-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/ngo_homesuite:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
