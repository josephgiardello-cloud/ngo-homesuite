[pytest]
testpaths = ngo_homesuite
addopts = --maxfail=10 -v
filterwarnings =
	error::DeprecationWarning
	ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:flask_login\.login_manager
	ignore:ast\.NameConstant is deprecated and will be removed in Python 3\.14; use ast\.Constant instead:DeprecationWarning:reportlab\.lib\.rl_safe_eval
