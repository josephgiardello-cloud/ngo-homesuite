[pytest]
testpaths = ngo_homesuite
addopts = --maxfail=10 -v --timeout=60 --cov=ngo_homesuite --cov-report=term-missing --cov-report=xml -m "not sqlcipher"
markers =
    sqlcipher: tests that require a real SQLCipher runtime/driver
filterwarnings =
	error::DeprecationWarning
	ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:flask_login\.login_manager

[coverage:run]
branch = True
omit =
    */tests/*
    */test_*.py
    setup.py

[coverage:report]
precision = 2
skip_empty = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
