version: "3.9"

# Profiles:
#   default          — app + Caddy edge (SQLite, development)
#   postgres         — app + PostgreSQL (production DB)
#   cache            — add Redis for server-side session storage
#   edge             — add Caddy TLS termination
#   postgres,edge    — full production stack

services:
  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngo-homesuite-app
    command: gunicorn -w 3 -k gthread --threads 4 --timeout 60 --graceful-timeout 20 --max-requests 1000 --max-requests-jitter 100 -b 0.0.0.0:8000 ngo_homesuite.wsgi:app
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      RATE_LIMIT_ENABLED: "True"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Application (PostgreSQL variant) — override DATABASE_URL when postgres profile active
  # ---------------------------------------------------------------------------
  app-pg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngo-homesuite-app-pg
    profiles: ["postgres"]
    command: gunicorn -w 3 -k gthread --threads 4 --timeout 60 --graceful-timeout 20 --max-requests 1000 --max-requests-jitter 100 -b 0.0.0.0:8000 ngo_homesuite.wsgi:app
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      RATE_LIMIT_ENABLED: "True"
      LOG_LEVEL: INFO
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ngohs}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-ngo_homesuite}
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ngo-homesuite-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ngo_homesuite}
      POSTGRES_USER: ${POSTGRES_USER:-ngohs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ngohs} -d ${POSTGRES_DB:-ngo_homesuite}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (optional profile for server-side sessions/cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ngo-homesuite-redis
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Caddy TLS termination
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8
    container_name: ngo-homesuite-caddy
    profiles: ["edge"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
